[project]
name = "bac-page"
version = "0.4.0"
description = "Create and manage bac.page short URLs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "InquirerPy>=0.3",
    "python-dotenv>=1.0",
    "qrcode[pil]>=7.4",
    "numpy>=1.26",
]

[project.scripts]
bac-page = "bac_page.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bac_page"]
